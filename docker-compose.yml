services:
  postgres:
    image: postgres:18-alpine
    container_name: tenderhack-postgres
    environment:
      POSTGRES_USER: tenderhack
      POSTGRES_PASSWORD: tenderhack
      POSTGRES_DB: tenderhack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
